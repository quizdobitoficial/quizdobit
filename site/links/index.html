  a.btn svg { width:28px; height:28px; flex:none; fill:var(--cor); }
  a.btn span small { display:block; margin-top:8px; font-size:9px; color:var(--muted); }
  .yt { --cor:var(--yt); } .ig { --cor:var(--ig); } .tt { --cor:var(--tt); }
  footer { margin-top:40px; font-size:8px; line-height:2; color:var(--muted); }

  @media (prefers-reduced-motion: reduce) { .avatar { animation:none; } }
